name: fix-consumer-set

# 2026-08-31: this file is a rewrite, not a new file. The previous tool here dropped meetnote
# from CONSUMER_FILES and it is used up: its own guards assert the meetnote line is present, so
# it now refuses to run. Rewriting in place is also the only channel that works. Adding a NEW
# workflow needs a new manifest registry line, and every tool that could add one is itself a new
# workflow -- the toolbox deadlock. Editing a file that is ALREADY registered leaves the
# directory set unchanged and makes exactly one hash stale, which refresh-integrity can fix.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'file holding CONSUMER_FILES'
        required: true
        default: verify.py

permissions: {}

jobs:
  patch:
    name: add the three CI patchers this list never counted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: patch the dict, re-render the doc, refresh both hashes
        id: patch
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ inputs.path }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 - 2>&1 <<'PYEOF' | tee artifacts/fix-consumer-set.log
          import hashlib, json, os, sys

          def blob(raw):
              return hashlib.sha1(b'blob %d\x00' % len(raw) + raw).hexdigest()

          TARGET = os.environ.get('TARGET', 'verify.py')
          DOC = 'docs/SHARED-WRITEBACK-CONSUMERS.md'
          MANIFEST = 'manifest.json'

          # Read 2026-08-31 from the real files on clickup-brain-backup main: all six workflows in
          # .github/workflows carry `uses: supercubegame/ci-workflows/.github/workflows/report.yml@main`.
          # The dict listed three. The three missing ones are CI patchers built after the dict was
          # written, so the "generated" file has been under-counting its own home repo.
          ADDED = ['fix-confusable.yml', 'patch-heartbeat-gap.yml', 'patch-yaml-shape.yml']

          OLD_DICT = "    'clickup-brain-backup': ['split-apply.yml', 'split-dry-run.yml', 'verify.yml'],\n"
          NEW_DICT = ("    'clickup-brain-backup': ['split-apply.yml', 'split-dry-run.yml', 'verify.yml',\n"
                      "                             'fix-confusable.yml', 'patch-heartbeat-gap.yml',\n"
                      "                             'patch-yaml-shape.yml'],\n")

          # The doc already admits it is rendered, not derived. What it did not say is that the
          # failure it warned about had happened AGAIN, in the other direction: not a phantom
          # consumer, a missing one.
          OLD_PROSE = ("        'It exists because a hand-maintained prose list already missed real consumers twice,"
                       " and the first version of this generated list missed one again.',\n")
          NEW_PROSE = (OLD_PROSE.rstrip('\n') + '\n'
                       "        'Read 2026-08-31 from the real files: clickup-brain-backup calls it from six workflows, not'\n"
                       "        ' three. The three CI patchers were added after this dict was written, and an offline gate'\n"
                       "        ' cannot see a repo grow a new caller -- so the generated file has now under-counted its own'\n"
                       "        ' home repo, which is the third time this list was wrong in the same direction.',\n")

          src = open(TARGET, encoding='utf-8').read()
          before = src.encode()
          print('target', TARGET)
          print('bytes ', len(before))
          print('blob  ', blob(before))

          for name, s in (('dict-line', OLD_DICT), ('prose-line', OLD_PROSE)):
              n = src.count(s)
              assert n == 1, '%s appears %d times, expected 1' % (name, n)
          for wf in ADDED:
              assert wf not in src, 'already lists %s' % wf

          out = src.replace(OLD_DICT, NEW_DICT, 1).replace(OLD_PROSE, NEW_PROSE, 1)
          after = out.encode()
          assert len(after) > len(before), 'file must grow'

          # Line survival: every original line must reappear in order, and exactly one may vanish.
          # "Most lines survived" is how a guard quietly stops guarding.
          #
          # Only the dict line is REPLACED. The prose line is EXTENDED -- NEW_PROSE opens with that
          # same line verbatim -- so it must survive, and asserting it disappeared would have been
          # a guard describing a property this patch does not have. The first local run said so.
          a, b = src.split('\n'), out.split('\n')
          GONE_EXPECT = [OLD_DICT.rstrip('\n')]
          gone = [l for l in a if l not in b]
          assert sorted(gone) == sorted(GONE_EXPECT), 'lines lost beyond the one named rewrite: %r' % gone[:4]
          keep = [l for l in a if l not in GONE_EXPECT]
          i = 0
          for line in keep:
              while i < len(b) and b[i] != line:
                  i += 1
              assert i < len(b), 'original line did not survive in order: %r' % line[:80]
              i += 1
          added = [l for l in b if l not in a]
          assert len(added) == 7, 'expected 7 new lines (3 dict + 4 prose), got %d: %r' % (len(added), added[:8])
          assert len(b) == len(a) + 6, 'expected net +6 lines, got %+d' % (len(b) - len(a))
          print('lines %d -> %d' % (len(a), len(b)))
          print('survived in order: %d of %d' % (len(keep), len(a)))
          print('edits: 1 dict line replaced by 3 (3 files -> 6) + 1 prose line extended by 4')
          print('LINE-SURVIVAL PROOF OK')

          # Re-render with the PATCHED file's own renderer. A second copy of the renderer in this
          # tool would be the exact disease this repo keeps logging.
          lo = out.index('CONSUMER_FILES = {')
          hi = out.index("    return '\\n'.join(lines).rstrip() + '\\n'\n", lo)
          hi += len("    return '\\n'.join(lines).rstrip() + '\\n'\n")
          slice_ = out[lo:hi]
          slice_ = '\n'.join(l for l in slice_.split('\n') if 'consumer_path' not in l)
          ns = {}
          exec(slice_, ns)
          doc = ns['render_consumers']()
          repos, wfs = ns['expected_repo_count'], ns['expected_workflow_count']
          print('rendered doc: %d repos / %d workflows' % (repos, wfs))
          assert (repos, wfs) == (6, 14), 'expected 6 repos / 14 workflows, got %d / %d' % (repos, wfs)

          # Independently predicted before this ran, from a local twin of the renderer that first
          # reproduced the OLD doc byte for byte. Two witnesses, not one.
          EXPECT_DOC_BLOB = '19b180f394603b335888e74bf6d4307f3235a126'
          EXPECT_DOC_BYTES = 1702
          got_blob, got_bytes = blob(doc.encode()), len(doc.encode())
          print('doc bytes %d (expected %d) blob %s (expected %s)' % (got_bytes, EXPECT_DOC_BYTES, got_blob, EXPECT_DOC_BLOB))
          assert (got_blob, got_bytes) == (EXPECT_DOC_BLOB, EXPECT_DOC_BYTES), 'the rendered doc is not the one that was predicted'

          backup = ns['CONSUMER_FILES']['clickup-brain-backup']
          assert len(backup) == len(set(backup)) == 6, 'the backup repo entry is not 6 distinct files: %r' % backup
          for wf in ADDED:
              assert backup.count(wf) == 1, '%s is not in the entry exactly once' % wf
              assert ('- `.github/workflows/%s`' % wf) in doc, '%s is missing from the rendered doc' % wf
          heads = [l for l in doc.split(chr(10)) if l.startswith('## ')]
          assert len(heads) == 6, 'expected 6 repo sections, got %d' % len(heads)

          if '--check' in sys.argv:
              print('check only, not writing')
              sys.exit(0)

          open(TARGET, 'w', encoding='utf-8').write(out)
          open(DOC, 'w', encoding='utf-8').write(doc)
          print('verify.py new bytes', len(after), 'blob', blob(after))

          # Full readback -> targeted field mutation -> whole-file reserialize. A 40-hex digit is
          # exactly what the hand channel gets wrong, so it is never typed.
          raw = open(MANIFEST, encoding='utf-8').read()
          obj = json.loads(raw)
          reg = obj['docs_integrity']
          touched = {}
          for rel in (TARGET, DOC):
              assert rel in reg, '%s is not registered, refusing to invent an entry' % rel
              old, new = reg[rel], blob(open(rel, 'rb').read())
              assert old != new, '%s hash did not change -- the edit did not land' % rel
              reg[rel] = new
              touched[rel] = (old, new)
          outm = json.dumps(obj, ensure_ascii=False, indent=2) + '\n'
          a2, b2 = json.loads(raw), json.loads(outm)
          assert a2.keys() == b2.keys(), 'top-level keys changed'
          for k in a2:
              if k != 'docs_integrity':
                  assert a2[k] == b2[k], 'unrelated key changed: %s' % k
          assert set(a2['docs_integrity']) == set(b2['docs_integrity']), 'registry key set changed'
          diff = [k for k in a2['docs_integrity'] if a2['docs_integrity'][k] != b2['docs_integrity'][k]]
          assert sorted(diff) == sorted(touched), 'unexpected hash changes: %r' % diff
          open(MANIFEST, 'w', encoding='utf-8').write(outm)
          for rel, (old, new) in sorted(touched.items()):
              print('refreshed %-40s %s -> %s' % (rel, old[:12], new[:12]))
          print('HASHES REFRESHED, EXACTLY 2')
          PYEOF
      - name: run the real gate, and carry its output onto the same log
        id: gate
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -eo pipefail
            python3 verify.py
          } 2>&1 | tee -a artifacts/fix-consumer-set.log
          echo 'GATE OK' | tee -a artifacts/fix-consumer-set.log
      - name: commit and push branch
        if: steps.patch.outcome == 'success' && steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/consumer-set-$(date -u +%Y%m%d%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "${{ inputs.path }}" docs/SHARED-WRITEBACK-CONSUMERS.md manifest.json
          git commit -m "fix: the backup repo calls the shared writeback from six workflows, not three"
          git push origin "$branch"
          echo "branch pushed: $branch"
          echo "open a PR at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/$branch"
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-consumer-set
          path: artifacts/
          if-no-files-found: error
      - name: fail if either step failed
        if: steps.patch.outcome != 'success' || steps.gate.outcome != 'success'
        run: exit 1
