name: fix-consumer-set

# 2026-08-31, third rewrite of this file today, and the name is now wrong -- it patches whatever
# the current round needs, and renaming it would cost a manifest registry line plus a
# refresh-integrity run for zero behaviour change. Registered as a known wart rather than
# pretended away: the job name below says what this round actually does.
#
# Why rewrite in place, again: adding a NEW workflow needs a new registry line, and every tool
# that could add one is itself a new workflow. Editing an already-registered file leaves the
# directory set alone and makes exactly one hash stale, which refresh-integrity handles. That
# path has now worked five times today.
#
# This round: nothing asserted that the two READMEs describe the same steps. AGENTS.md and
# CLAUDE.md have a byte-identity check precisely because two copies drift; the READMEs cannot be
# byte-identical, so they got no check at all -- and drifted for a week. The stranger walkthrough
# found two documentation gaps, both were fixed in README.md, neither in README_CN.md.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'file holding the checks'
        required: true
        default: verify.py

permissions: {}

jobs:
  patch:
    name: assert the two READMEs agree on steps and load-bearing facts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: insert the parity check, update the gate doc, refresh two hashes
        id: patch
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ inputs.path }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 .github/payloads/readme-parity-patch.py 2>&1 | tee artifacts/readme-parity.log
      - name: run the real gate, and carry its output onto the same log
        id: gate
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -eo pipefail
            python3 verify.py
          } 2>&1 | tee -a artifacts/readme-parity.log
          echo 'GATE OK' | tee -a artifacts/readme-parity.log
      # No gh pr create. Actions is not permitted to open PRs in this org, and a step that always
      # fails only teaches people to ignore red crosses. Pushing the branch is the success
      # condition; opening the PR is a human step.
      - name: commit and push branch
        if: steps.patch.outcome == 'success' && steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          branch="ci/readme-parity-$(date -u +%Y%m%d%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "${{ inputs.path }}" docs/MINIMAL-GATE.md manifest.json
          git commit -m "ci: assert the two READMEs agree on steps and load-bearing setup facts"
          git push origin "$branch"
          echo "branch pushed: $branch"
          echo "open a PR at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/$branch"
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-readme-parity
          path: artifacts/
          if-no-files-found: error
      - name: fail if either step failed
        if: steps.patch.outcome != 'success' || steps.gate.outcome != 'success'
        run: exit 1
