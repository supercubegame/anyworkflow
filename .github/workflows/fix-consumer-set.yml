name: fix-consumer-set

# 2026-08-31, second rewrite of this same file today. It is used up again: its guards asserted the
# three-file clickup-brain-backup dict line, and the morning run replaced it, so it now refuses to
# run. Rewriting in place is still the only channel that works -- a NEW workflow needs a new
# registry line, and every tool that could add one is itself a new workflow. Editing an
# already-registered file leaves the directory set alone and makes exactly one hash stale, which
# refresh-integrity handles. That path has now worked four times today.
#
# What this round does: the generated consumer list was wrong a FOURTH time, and this time it
# omitted the repo it lives in -- anyworkflow's own verify.yml calls the shared writeback. So the
# fix is not another hand-written line. The anyworkflow entry becomes DERIVED from the real .yml
# files on disk, guarded by a new check. That is one seventh of the list; the other six repos need
# a cross-repo token this offline gate does not have, and the doc now says so in its own body.
#
# The patch logic lives in .github/payloads/self-derive-patch.py rather than inline here, for two
# reasons: this file stays small enough to rebuild and blob-check by hand, and the script can be
# run locally against a twin before it ever touches the repo. That directory is deliberately not
# in REGISTERED_DIRS, so adding a file there does not trip the registry check -- and the honest
# cost is that the script itself is not hash-guarded. It is a one-shot tool and the real gate runs
# after it, so that trade is acceptable; it would not be for anything long-lived.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'file holding CONSUMER_FILES'
        required: true
        default: verify.py

permissions: {}

jobs:
  patch:
    name: derive the anyworkflow entry from real files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: patch verify.py, re-render the doc, update the gate doc, refresh three hashes
        id: patch
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ inputs.path }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 .github/payloads/self-derive-patch.py 2>&1 | tee artifacts/fix-consumer-set.log
      - name: run the real gate, and carry its output onto the same log
        id: gate
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -eo pipefail
            python3 verify.py
          } 2>&1 | tee -a artifacts/fix-consumer-set.log
          echo 'GATE OK' | tee -a artifacts/fix-consumer-set.log
      # No gh pr create here. Actions is not permitted to open PRs in this org, and a step that
      # always fails only teaches people to ignore red crosses. Pushing the branch is the declared
      # success condition; opening the PR is a human step.
      - name: commit and push branch
        if: steps.patch.outcome == 'success' && steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/consumer-self-derive-$(date -u +%Y%m%d%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "${{ inputs.path }}" docs/SHARED-WRITEBACK-CONSUMERS.md docs/MINIMAL-GATE.md manifest.json
          git commit -m "fix: derive the anyworkflow consumer entry from the real files on disk"
          git push origin "$branch"
          echo "branch pushed: $branch"
          echo "open a PR at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/$branch"
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-consumer-set
          path: artifacts/
          if-no-files-found: error
      - name: fail if either step failed
        if: steps.patch.outcome != 'success' || steps.gate.outcome != 'success'
        run: exit 1
