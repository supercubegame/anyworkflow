name: renew-readback

on:
  workflow_dispatch:
    inputs:
      quinn_at:
        description: 'Quinn readback_at (ISO Z)'
        required: true
      devon_at:
        description: 'Devon readback_at (ISO Z)'
        required: true

permissions: {}

jobs:
  renew:
    name: patch readback_at and push a branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: patch two fields only
        shell: bash
        env:
          QUINN_AT: ${{ inputs.quinn_at }}
          DEVON_AT: ${{ inputs.devon_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, hashlib, re
          ISO = re.compile(r'^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$')
          q, d = os.environ['QUINN_AT'], os.environ['DEVON_AT']
          for v in (q, d):
              assert ISO.match(v), f'bad timestamp: {v}'
          raw = open('manifest.json', encoding='utf-8').read()
          before = raw.encode()
          print('base bytes', len(before))
          print('base blob ', hashlib.sha1(b'blob %d\x00' % len(before) + before).hexdigest())
          obj = json.loads(raw)
          copies = obj['true_copies']['copies']
          qk, dk = 'agents/gate-audit-quinn.md', 'agents/drift-devon.md'
          old_q = copies[qk]['readback_at']
          old_d = copies[dk]['readback_at']
          copies[qk]['readback_at'] = q
          copies[dk]['readback_at'] = d
          out = json.dumps(obj, ensure_ascii=False, indent=2) + '\n'
          after = out.encode()
          a, b = json.loads(raw), json.loads(out)
          diffs = []
          def walk(x, y, p=''):
              if isinstance(x, dict):
                  assert x.keys() == y.keys(), p
                  for k in x: walk(x[k], y[k], p + '/' + k)
              elif isinstance(x, list):
                  assert len(x) == len(y), p
                  for i, (m, n) in enumerate(zip(x, y)): walk(m, n, p + f'[{i}]')
              elif x != y:
                  diffs.append((p, x, y))
          walk(a, b)
          for p, x, y in diffs:
              print('changed', p, x, '->', y)
          assert len(diffs) == 2, f'expected exactly 2 changes, got {len(diffs)}'
          assert len(after) == len(before), 'byte length must not change'
          open('manifest.json', 'w', encoding='utf-8').write(out)
          print('new bytes', len(after))
          print('new blob ', hashlib.sha1(b'blob %d\x00' % len(after) + after).hexdigest())
          print('quinn', old_q, '->', q)
          print('devon', old_d, '->', d)
          PY
      # 2026-08-31: gh pr create was removed, not fixed. Run #5 died on
      # 'GitHub Actions is not permitted to create or approve pull requests', which is a
      # repo/org setting no job-level permission can grant. The patch and the push had
      # already succeeded, so the only thing that step contributed was a red cross whose
      # cause had nothing to do with the output. Pushing the branch IS the success
      # condition now; opening the PR is a human step, and saying so is cheaper than
      # keeping a step that always fails.
      - name: commit and push a branch
        env:
          QUINN_AT: ${{ inputs.quinn_at }}
          DEVON_AT: ${{ inputs.devon_at }}
        shell: bash
        run: |
          set -euo pipefail
          branch="sync/renew-readback-$(date -u +%Y%m%d%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          if git diff --quiet -- manifest.json; then
            echo 'nothing changed - already at these timestamps'
            exit 0
          fi
          git add manifest.json
          git commit -m "sync: renew agent copy readback_at (CI-side patch, no hand-copied bytes)"
          git push origin "$branch"
          echo "branch pushed: $branch"
          echo "- Quinn readback_at -> ${QUINN_AT}"
          echo "- Devon readback_at -> ${DEVON_AT}"
          echo 'The patch step asserts exactly two changed fields, identical key sets, and'
          echo 'unchanged byte length, and prints both blobs, so this log is self-proving.'
          echo "open a PR at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/$branch"
