name: approved maintenance
on:
  push:
    branches: ['docs/final-inactive-20260907']
  workflow_dispatch:
permissions: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Sync approved inactive monitoring policy
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$BRANCH" = 'docs/final-inactive-20260907'
          mkdir -p artifacts
          python3 sync_final_inactive.py 2>&1 | tee artifacts/inactive-policy.log
          python3 verify.py 2>&1 | tee -a artifacts/inactive-policy.log
          git add manifest.json verify.py docs/QUINN-FIELD-NOTES.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: guard explicit inactive meetnote monitoring policy'
          git push origin HEAD:docs/final-inactive-20260907
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maintenance-evidence
          path: artifacts/
