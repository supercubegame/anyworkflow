name: approved maintenance
on:
  push:
    branches: ['maintenance/pr-route-copy-20260907']
  workflow_dispatch:
permissions: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Sync only approved upstream copy on dedicated branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$BRANCH" = 'maintenance/pr-route-copy-20260907'
          mkdir -p artifacts
          python3 sync_pr_route_copy.py 2>&1 | tee artifacts/copy-sync.log
          python3 verify.py 2>&1 | tee -a artifacts/copy-sync.log
          git add manifest.json vendor/ci-workflows/report.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record exact direct-PR report source and integrity'
          git push origin HEAD:maintenance/pr-route-copy-20260907
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maintenance-evidence
          path: artifacts/
